spring.ai.openai.api-key=YOUR_API_KEY_HERE
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-3.5-flash-lite
spring.datasource.url=jdbc:postgresql://localhost:5432/laptop_store_db
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=LaptopStoreSecretKeyThatIsVeryLongAndSecure12345!

jwt.expiration=86400000

server.port=8080

spring.jackson.serialization.fail-on-empty-beans=false
